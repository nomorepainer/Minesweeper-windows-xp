<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nomorepainer</title>
<link rel="icon" type="image/png" href="socials/duck.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --card: #000000;
    --border: #1b2540;
    --text: #e6ecff;
    --muted: #7a86a8;
    --accent: #3d7bff;
    --accent2: #6a5cff;
    --accent3: #2fd6ff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  .welcome {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    z-index: 999;
    opacity: 1;
    transition: opacity 1.5s ease;
    padding: 24px;
  }

  .welcome.hide { opacity: 0; pointer-events: none; }

  .welcome h2 {
    font-size: 26px;
    text-align: center;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #e6ecff, #9db4ff, #6a5cff, #2fd6ff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rgb 5s ease infinite;
  }

  @keyframes rgb {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .continue-btn {
    padding: 14px 42px;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text);
    background: rgba(20, 28, 50, 0.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  .continue-btn:hover {
    border-color: rgba(61,123,255,0.6);
    transform: translateY(-2px);
    box-shadow: 0 0 28px rgba(61,123,255,0.35);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 22px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    box-shadow: 0 0 24px rgba(61,123,255,0.45);
  }

  .avatar video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-size: 24px;
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #e6ecff, #9db4ff, #6a5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  a.link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(12px);
    animation: linkAppear 0.5s ease forwards;
  }

  @keyframes linkAppear {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  a.link:nth-child(1) { animation-delay: 0.05s; }
  a.link:nth-child(2) { animation-delay: 0.10s; }
  a.link:nth-child(3) { animation-delay: 0.15s; }
  a.link:nth-child(4) { animation-delay: 0.20s; }
  a.link:nth-child(5) { animation-delay: 0.25s; }
  a.link:nth-child(6) { animation-delay: 0.30s; }
  a.link:nth-child(7) { animation-delay: 0.35s; }
  a.link:nth-child(8) { animation-delay: 0.40s; }

  a.link:hover {
    border-color: rgba(61,123,255,0.5);
    background: #0a0e1a;
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(61,123,255,0.2);
  }

  .link-icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }

  .email-footer {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .email-footer a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.25s ease;
  }

  .email-footer a:hover { color: var(--accent3); }

  .email-footer img {
    width: 18px;
    height: 18px;
    object-fit: contain;
    display: block;
    opacity: 0.8;
    transition: opacity 0.25s ease;
  }

  .email-footer a:hover img { opacity: 1; }

  .visitor-badge {
    margin-top: 22px;
    display: flex;
    justify-content: center;
  }

  .visitor-badge img {
    height: 44px !important;
    width: auto !important;
    max-width: none !important;
    min-height: 44px !important;
    display: block !important;
    image-rendering: -webkit-optimize-contrast;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 20px; }
    a.link { padding: 12px 14px; font-size: 14px; gap: 14px; }
    .link-icon { width: 26px; height: 26px; }
    .welcome h2 { font-size: 20px; }
    .continue-btn { padding: 12px 32px; }
    .email-footer a { font-size: 13px; }
    .email-footer img { width: 16px; height: 16px; }

    .visitor-badge img {
      height: 40px !important;
      min-height: 40px !important;
    }
  }
</style>
</head>
<body>

  <div class="welcome" id="welcome">
    <h2>Добро пожаловать на сайт!</h2>
    <button class="continue-btn" onclick="enterSite()">Перейти на страницу</button>
  </div>

  <div class="card">

    <div class="avatar">

    <h1>nomorepainer</h1>

        <img class="link-icon" src="socials/Instagram.png" alt=""> Instagram
      </a>
      <a class="link" href="https://tiktok.com/@nomorepainer"
         data-app="snssdk1233://user/profile/nomorepainer"
         target="_blank" rel="noopener">

      <a class="link" href="https://youtube.com/@nomorepainer228" target="_blank" rel="noopener">
        <img class="link-icon" src="socials/YouTube.png" alt=""> YouTube
      </a>
      <a class="link" href="https://discord.com/users/1520081730764148798"
         data-app="discord://-/users/1520081730764148798"

        <img class="link-icon" src="socials/Discord.png" alt=""> Discord
      </a>
      <a class="link" href="https://steamcommunity.com/id/nomorepainer" target="_blank" rel="noopener">
        <img class="link-icon" src="socials/Steam.png" alt=""> Steam
      </a>
    </div>

    <div class="email-footer">
      <a href="mailto:nomorepainer@gmail.com">
        <img src="socials/Gmail.png" alt="">

      </a>

      <div class="visitor-badge">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=nomorepainer.mooo.com&left_text=visits&left_color=%23000000&right_color=%23000000&left_text_color=%23ffffff&right_text_color=%233d7bff" alt="visits">
      </div>
    </div>

  </div>

  <script>
    function enterSite() {
      const welcome = document.getElementById('welcome');
      welcome.classList.add('hide');
      setTimeout(() => {
        welcome.style.display = 'none';
      }, 1500);
    }

    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (isMobile) {
      document.querySelectorAll('a.link[data-app]').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const appLink = this.dataset.app;
          const webLink = this.href;
          window.location.href = appLink;
          setTimeout(() => {
            window.location.href = webLink;
          }, 1500);
        });
      });
    }
  </script>
</body>
</html>
