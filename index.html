<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nomorepainer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --card: #0f1526;
    --border: #1b2540;
    --text: #e6ecff;
    --muted: #7a86a8;
    --accent: #3d7bff;
    --accent2: #6a5cff;
    --accent3: #2fd6ff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* ====== ЭКРАН ПРИВЕТСТВИЯ ====== */
  .welcome {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    z-index: 999;
    opacity: 1;
    transition: opacity 1.5s ease;
    padding: 24px;
  }

  .welcome.hide {
    opacity: 0;
    pointer-events: none;
  }

  .welcome h2 {
    font-size: 26px;
    text-align: center;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #e6ecff, #9db4ff, #6a5cff, #2fd6ff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rgb 5s ease infinite;
  }

  @keyframes rgb {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .continue-btn {
    padding: 14px 42px;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text);
    background: rgba(20, 28, 50, 0.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .continue-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: -1;
  }

  .continue-btn:hover {
    border-color: rgba(61,123,255,0.6);
    transform: translateY(-2px);
    box-shadow: 0 0 28px rgba(61,123,255,0.35);
  }

  .continue-btn:hover::before { opacity: 0.18; }

  /* ====== ОСНОВНОЙ КОНТЕНТ ====== */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 25% 25%, rgba(61,123,255,0.18), transparent 45%),
      radial-gradient(circle at 75% 75%, rgba(106,92,255,0.15), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(47,214,255,0.12), transparent 50%);
    animation: float 14s ease-in-out infinite alternate;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes float {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, -3%) scale(1.05); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: rgba(15, 21, 38, 0.85);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow:
      0 0 40px rgba(61, 123, 255, 0.12),
      0 0 80px rgba(106, 92, 255, 0.08),
      inset 0 1px 0 rgba(255,255,255,0.03);
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    background-size: 200% 200%;
    animation: rgb 6s ease infinite;
    color: #fff;
    box-shadow: 0 0 24px rgba(61,123,255,0.45);
  }

  h1 {
    font-size: 24px;
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #e6ecff, #9db4ff, #6a5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  a.link {
    display: flex;
    align-items: center;
    padding: 13px 18px;
    background: rgba(20, 28, 50, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  a.link::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent2), var(--accent3));
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  a.link:hover {
    border-color: rgba(61,123,255,0.5);
    background: rgba(30, 42, 75, 0.8);
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(61,123,255,0.2);
  }

  a.link:hover::before { opacity: 1; }

  .link-label {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    display: block;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 20px; }
    a.link { padding: 11px 14px; font-size: 14px; }
    .welcome h2 { font-size: 20px; }
    .continue-btn { padding: 12px 32px; }
  }
</style>
</head>
<body>

  <!-- ====== ЭКРАН ПРИВЕТСТВИЯ ====== -->
  <div class="welcome" id="welcome">
    <h2>Добро пожаловать на сайт!</h2>
    <button class="continue-btn" onclick="enterSite()">Продолжить</button>
  </div>

  <!-- ====== ОСНОВНОЙ КОНТЕНТ ====== -->
  <div class="card">

    <div class="avatar">N</div>
    <h1>nomorepainer</h1>

    <div class="links">
      <a class="link" href="https://t.me/qwerty81996" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/Telegram.png" alt=""> Telegram</span>
      </a>
      <a class="link" href="https://t.me/+xzVGkA56BkI5OTli" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/Telegram.png" alt=""> Telegram-канал</span>
      </a>
      <a class="link" href="https://github.com/nomorepainer" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/Github.png" alt=""> GitHub</span>
      </a>
      <a class="link" href="https://x.com/nomorepainer" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/X.png" alt=""> X (Twitter)</span>
      </a>
      <a class="link" href="https://instagram.com/nomorepainer" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/Instagram.png" alt=""> Instagram</span>
      </a>
      <a class="link" href="https://tiktok.com/@nomorepainer" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/TikTok.png" alt=""> TikTok</span>
      </a>
      <a class="link" href="https://youtube.com/@nomorepainer228" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/YouTube.png" alt=""> YouTube</span>
      </a>
      <a class="link" href="#" onclick="copyId('nomorepainer228'); return false;">
        <span class="link-label"><img class="link-icon" src="socials/Discord.png" alt=""> Discord</span>
      </a>
      <a class="link" href="https://steamcommunity.com/id/nomorepainer" target="_blank" rel="noopener">
        <span class="link-label"><img class="link-icon" src="socials/Steam.png" alt=""> Steam</span>
      </a>
    </div>

  </div>

  <script>
    // Плавно скрываем экран приветствия за 1.5 сек
    function enterSite() {
      const welcome = document.getElementById('welcome');
      welcome.classList.add('hide');
      setTimeout(() => {
        welcome.style.display = 'none';
      }, 1500);
    }

    function copyId(id) {
      navigator.clipboard.writeText(id).then(() => {
        // небольшая визуальная вспышка при копировании
        const link = event.currentTarget;
        const oldBg = link.style.background;
        link.style.background = 'rgba(47, 214, 255, 0.15)';
        setTimeout(() => {
          link.style.background = oldBg;
        }, 400);
      });
    }
  </script>
</body>
</html>
